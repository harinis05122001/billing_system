services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billing_system
      POSTGRES_USER: billing
      # Local development only -- never used outside this container network.
      # Override via a real secret for any non-local deployment.
      POSTGRES_PASSWORD: billing_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
